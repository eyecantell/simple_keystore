[project]
name = "simple_keystore"
version = "0.2.10"
description = "\"A simple encrypted key storage\""
authors = [
    {name = "Paul", email = "paul@nowfree.org"},
]
dependencies = [
    "cryptography>=43.0.0",
    "tabulate>=0.9.0",
    "psycopg>=3.2.4",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120

[tool.pdm]
distribution = true
package-dir = "src"
[project.urls]
Repository = "https://github.com/eyecantell/simple_keystore"
Issues = "https://github.com/eyecantell/simple_keystore/issues"

[project.scripts]
manage_simple_keys = "manage_simple_keys:main"


[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
